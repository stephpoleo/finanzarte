<!-- Header: outside scroll -->
<ion-header class="ion-no-border">
  <ion-toolbar class="header-toolbar">
    <header class="app-header">
      <div class="header-brand">
        <div class="brand-icon">
          <img src="assets/images/finanzarte_logo.jpeg" alt="Finanzarte" class="brand-logo" />
        </div>
        <div class="brand-text">
          <h1 class="brand-name">Finanzarte</h1>
          <p class="brand-tagline">El arte de las finanzas</p>
        </div>
      </div>
      <div class="header-actions">
        <button class="settings-btn" (click)="goToSettings()" title="Ajustes">
          <ion-icon name="settings-outline"></ion-icon>
        </button>
        <button class="logout-btn" (click)="logout()" title="Cerrar sesión">
          <ion-icon name="log-out-outline"></ion-icon>
        </button>
      </div>
    </header>

    <!-- Household Toggle -->
    @if (household.isInHousehold() && activeTab === 'presupuesto') {
      <div class="household-toggle-wrapper">
        <div class="household-toggle">
          <button
            class="toggle-btn"
            [class.active]="household.viewMode() === 'personal'"
            (click)="household.viewMode.set('personal')">
            <ion-icon name="person-outline"></ion-icon>
            <span>Personal</span>
          </button>
          <button
            class="toggle-btn"
            [class.active]="household.viewMode() === 'household'"
            (click)="household.viewMode.set('household')">
            <ion-icon name="people-outline"></ion-icon>
            <span>Hogar</span>
          </button>
        </div>
      </div>
    }
  </ion-toolbar>
</ion-header>

<!-- Scrollable content -->
<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="handleRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <div class="app-container">
    @if (activeTab === 'presupuesto') {
      <app-presupuesto-tab
        (navigateToEmergencia)="navigateToTab('emergencia')"
        (navigateToAhorros)="navigateToTab('ahorros')">
      </app-presupuesto-tab>
    }

    @if (activeTab === 'emergencia') {
      <app-emergencia-tab [emergencyAvailableSavings]="emergencyAvailableSavings">
      </app-emergencia-tab>
    }

    @if (activeTab === 'ahorros') {
      <app-ahorros-tab
        [emergencyRecommendedPct]="emergencyRecommendedPct"
        (navigateToInversiones)="navigateToTab('inversiones')">
      </app-ahorros-tab>
    }

    @if (activeTab === 'inversiones') {
      <app-inversiones-tab></app-inversiones-tab>
    }

    @if (activeTab === 'retiro') {
      <app-retiro-tab></app-retiro-tab>
    }
  </div>
</ion-content>

<!-- Bottom Navigation: outside scroll -->
<ion-footer class="ion-no-border">
  <ion-toolbar class="footer-toolbar">
    <nav class="nav-tabs">
      <button class="nav-tab" [class.active-green]="activeTab === 'presupuesto'" (click)="navigateToTab('presupuesto')">
        <ion-icon name="wallet-outline"></ion-icon>
        <span>Presupuesto</span>
      </button>
      <button class="nav-tab" [class.active-cyan]="activeTab === 'emergencia'" (click)="navigateToTab('emergencia')">
        <ion-icon name="shield-checkmark-outline"></ion-icon>
        <span>Emergencia</span>
      </button>
      <button class="nav-tab" [class.active-amber]="activeTab === 'ahorros'" (click)="navigateToTab('ahorros')">
        <ion-icon name="leaf-outline"></ion-icon>
        <span>Ahorros</span>
      </button>
      <button class="nav-tab" [class.active-indigo]="activeTab === 'inversiones'" (click)="navigateToTab('inversiones')">
        <ion-icon name="trending-up-outline"></ion-icon>
        <span>Inversiones</span>
      </button>
      <button class="nav-tab" [class.active-purple]="activeTab === 'retiro'" (click)="navigateToTab('retiro')">
        <ion-icon name="flag-outline"></ion-icon>
        <span>Retiro</span>
      </button>
    </nav>
  </ion-toolbar>
</ion-footer>
